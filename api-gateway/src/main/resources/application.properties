spring.application.name=api-gateway
server.port=8080

# Downstream Microservices URLs
services.product.url=http://localhost:8081
services.order.url=http://localhost:8082
services.auth.url=http://localhost:8083
services.payment.url=http://localhost:8084

# Actuator & Logging
management.endpoints.web.exposure.include=health,info,metrics
logging.level.com.ecommerce.gateway=INFO
